<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">StreamDock first-run flow</title>
  <desc id="flow-desc">Compose up, open the panel, add an Emby reverse-proxy site, then curl the listen port.</desc>
  <defs>
    <pattern id="flow-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d7e2ea" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="220" fill="#f4f6f8"/>
  <rect width="1200" height="220" fill="url(#flow-grid)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#1c2b36"/>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="36" y="48" width="252" height="124" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
    <text x="162" y="88" text-anchor="middle" fill="#3e5360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">01</text>
    <text x="162" y="118" text-anchor="middle" fill="#1c2b36" font-size="22" font-weight="700">Compose</text>
    <text x="162" y="146" text-anchor="middle" fill="#334654" font-size="18">docker compose up</text>

    <rect x="300" y="106" width="36" height="2" fill="#2f5f73"/>
    <rect x="328" y="100" width="8" height="8" fill="#2f5f73"/>

    <rect x="348" y="48" width="252" height="124" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
    <text x="474" y="88" text-anchor="middle" fill="#3e5360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">02</text>
    <text x="474" y="118" text-anchor="middle" fill="#1c2b36" font-size="22" font-weight="700">打开面板</text>
    <text x="474" y="146" text-anchor="middle" fill="#334654" font-size="18">127.0.0.1:9090</text>

    <rect x="612" y="106" width="36" height="2" fill="#2f5f73"/>
    <rect x="640" y="100" width="8" height="8" fill="#2f5f73"/>

    <rect x="660" y="48" width="252" height="124" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
    <text x="786" y="88" text-anchor="middle" fill="#3e5360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">03</text>
    <text x="786" y="118" text-anchor="middle" fill="#1c2b36" font-size="22" font-weight="700">添加站点</text>
    <text x="786" y="146" text-anchor="middle" fill="#334654" font-size="18">监听口 → Emby</text>

    <rect x="924" y="106" width="36" height="2" fill="#c45c26"/>
    <rect x="952" y="100" width="8" height="8" fill="#c45c26"/>

    <rect x="972" y="48" width="192" height="124" fill="#1c2b36"/>
    <text x="1068" y="88" text-anchor="middle" fill="#94a8b4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">04</text>
    <text x="1068" y="118" text-anchor="middle" fill="#f4f6f8" font-size="22" font-weight="700">curl 验证</text>
    <text x="1068" y="146" text-anchor="middle" fill="#e6eef2" font-size="18">:8001 运行灯</text>
  </g>
</svg>
