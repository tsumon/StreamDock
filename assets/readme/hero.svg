<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">StreamDock</title>
  <desc id="desc">Single-binary Emby reverse-proxy panel. Plaintext site import and export, dedicated traffic page. GitHub tsumon/StreamDock.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d7e2ea" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#f4f6f8"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#1c2b36"/>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="48" y="72" fill="#3e5360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.4">EMBY REVERSE PROXY</text>
    <text x="48" y="148" fill="#1c2b36" font-size="64" font-weight="700" letter-spacing="-2">StreamDock</text>
    <text x="48" y="196" fill="#334654" font-size="22">单二进制 Emby 反代面板。</text>
    <text x="48" y="230" fill="#334654" font-size="22">明文导入导出，独立流量页。</text>
    <text x="48" y="292" fill="#3e5360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Go 1.26 · SQLite · MIT</text>
    <text x="48" y="320" fill="#3e5360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">github.com/tsumon/StreamDock</text>
  </g>

  <g transform="translate(700 56)">
    <rect x="0" y="0" width="452" height="288" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
    <rect x="0" y="0" width="452" height="40" fill="#f4f6f8" stroke="#1c2b36" stroke-width="1"/>
    <text x="20" y="26" fill="#1c2b36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">SITE :8001 · RUNNING</text>
    <circle cx="420" cy="20" r="5" fill="#2e7d4f"/>

    <text x="20" y="78" fill="#2f5f73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.4">API</text>
    <line x1="20" y1="92" x2="240" y2="92" stroke="#2f5f73" stroke-width="2"/>
    <rect x="236" y="86" width="12" height="12" fill="#2f5f73"/>
    <text x="258" y="98" fill="#1c2b36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">origin :8096</text>

    <text x="20" y="148" fill="#c45c26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.4">PLAYBACK</text>
    <line x1="20" y1="162" x2="240" y2="162" stroke="#c45c26" stroke-width="2"/>
    <rect x="236" y="156" width="12" height="12" fill="#c45c26"/>
    <text x="258" y="168" fill="#1c2b36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">cdn / node</text>

    <text x="20" y="230" fill="#3e5360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">面板 :9090 · 导出 JSON</text>
    <text x="20" y="258" fill="#3e5360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">亮 / 暗 / 跟随系统</text>
  </g>
</svg>
