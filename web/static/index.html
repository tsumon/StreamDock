<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamDock — Emby 反代管理面板</title>
<meta name="description" content="StreamDock 轻量级 Emby 反向代理管理面板">
<meta name="theme-color" content="#f4f6f8">
<script>
(function(){var k='streamdock-theme',t='light';try{var s=localStorage.getItem(k);if(s==='light'||s==='dark')t=s;else if(window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){}var r=document.documentElement;r.setAttribute('data-theme',t);r.style.colorScheme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#151c21':'#f4f6f8');})();
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<a class="skip-link" href="#main">跳到内容</a>

<!-- Login Page -->
<div id="page-login">
  <div class="login-card">
    <div class="login-theme">
      <div class="theme-switch" role="group" aria-label="主题">
        <button type="button" class="theme-switch-btn" data-theme-choice="light" aria-pressed="false" aria-label="亮色">亮</button>
        <button type="button" class="theme-switch-btn" data-theme-choice="dark" aria-pressed="false" aria-label="暗色">暗</button>
      </div>
    </div>
    <div class="login-brand">
      <h1>StreamDock</h1>
      <p>Emby 反代管理面板</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="inp-username">用户名</label>
        <input type="text" class="form-input" id="inp-username" name="username" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="inp-password">密码</label>
        <input type="password" class="form-input" id="inp-password" name="password" placeholder="至少 12 位" autocomplete="current-password" required minlength="12">
      </div>
      <div class="form-group" id="setup-token-group" hidden>
        <label for="inp-setup-token">初始化令牌</label>
        <input type="password" class="form-input" id="inp-setup-token" name="setup_token" placeholder="SETUP_TOKEN" autocomplete="off">
        <p class="login-note" style="margin-top:6px">首次安装时写在启动日志或 <code>.env</code> 的 <code>SETUP_TOKEN</code>。</p>
      </div>
      <button type="submit" class="btn-login" id="btn-login">登录</button>
    </form>
    <div class="login-footer" id="login-footer">正在检查初始化状态…</div>
  </div>
</div>

<!-- App Shell -->
<div id="app-shell">

  <nav class="topnav" aria-label="主导航">
    <div class="topnav-brand"><img src="/favicon.svg" alt="" class="topnav-logo"><span>StreamDock</span></div>
    <div class="topnav-links">
      <a href="#dashboard" class="topnav-link active" data-page="dashboard">仪表盘</a>
      <a href="#sites" class="topnav-link" data-page="sites">站点管理</a>
      <a href="#traffic" class="topnav-link" data-page="traffic">流量统计</a>
      <a href="#diagnostics" class="topnav-link" data-page="diagnostics">故障诊断</a>
    </div>
    <div class="topnav-right">
      <div class="theme-switch" role="group" aria-label="主题">
        <button type="button" class="theme-switch-btn" data-theme-choice="light" aria-pressed="false" aria-label="亮色">亮</button>
        <button type="button" class="theme-switch-btn" data-theme-choice="dark" aria-pressed="false" aria-label="暗色">暗</button>
      </div>
      <div class="account-menu">
        <button type="button" class="avatar-btn" id="avatar-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="account-panel" aria-label="账户菜单">A</button>
        <div class="account-panel" id="account-panel" role="menu" hidden>
          <div class="account-name" id="account-name"></div>
          <button type="button" class="btn-ghost" id="btn-logout" role="menuitem">退出登录</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main" id="main" tabindex="-1">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-sites" class="page"></div>
    <div id="page-traffic" class="page"></div>
    <div id="page-diagnostics" class="page"></div>
  </div>

  <nav class="mobile-bar" aria-label="移动导航">
    <div class="mobile-bar-inner">
      <a href="#dashboard" class="mobile-tab active" data-page="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        仪表盘
      </a>
      <a href="#sites" class="mobile-tab" data-page="sites">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        站点
      </a>
      <a href="#traffic" class="mobile-tab" data-page="traffic">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        流量
      </a>
      <a href="#diagnostics" class="mobile-tab" data-page="diagnostics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        诊断
      </a>
    </div>
  </nav>

  <dialog class="modal-dialog" id="modal" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button type="button" class="modal-close" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </dialog>

  <div id="toast-container" aria-live="polite" aria-relevant="additions"></div>

</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/router.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/sites.js"></script>
<script src="/js/pages/traffic.js"></script>
<script src="/js/pages/diag.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
