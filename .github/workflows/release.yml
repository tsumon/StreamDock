name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o streamdock .

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # GitHub's official opt-in while some upstream actions still ship on node20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w -X main.appVersion=${GITHUB_REF_NAME}" -o streamdock-${{ matrix.suffix }} .

      - name: Windows zip
        if: matrix.goos == 'windows'
        run: |
          mkdir -p dist-win
          cp "streamdock-${{ matrix.suffix }}" dist-win/streamdock.exe
          (cd dist-win && zip -9 ../streamdock-windows-amd64.zip streamdock.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: streamdock-${{ matrix.suffix }}
          path: streamdock-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'windows'
        with:
          name: streamdock-windows-amd64.zip
          path: streamdock-windows-amd64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum streamdock-* | tee sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            streamdock-*
            sha256sums.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
      contents: read
    env:
      IMAGE_NAME: ghcr.io/tsumon/streamdock

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
